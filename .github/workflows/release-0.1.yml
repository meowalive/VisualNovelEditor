name: Build And Upload Release 0.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-0.1
  cancel-in-progress: true

env:
  DOTNET_VERSION: 9.0.x
  PROJECT_PATH: VNEditor.csproj
  RELEASE_TAG: Release
  PUBLISH_DIR: artifacts/publish/win-x64
  RELEASE_ASSET_NAME: VNEditor.exe

jobs:
  publish-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        shell: bash
        run: dotnet restore "$PROJECT_PATH"

      - name: Publish Release Build
        shell: bash
        run: |
          dotnet publish "$PROJECT_PATH" \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:EditorRepositoryRemoteUrl="${{ github.server_url }}/${{ github.repository }}" \
            -o "$PUBLISH_DIR"

      - name: Create Or Update Release On Gitea
        if: ${{ github.server_url != 'https://github.com' }}
        uses: akkuman/gitea-release-action@v1
        with:
          token: ${{ github.token }}
          server_url: ${{ github.server_url }}
          repository: ${{ github.repository }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ env.PUBLISH_DIR }}/${{ env.RELEASE_ASSET_NAME }}

      - name: Create Or Update Release On GitHub
        if: ${{ github.server_url == 'https://github.com' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.PUBLISH_DIR }}/${{ env.RELEASE_ASSET_NAME }}
