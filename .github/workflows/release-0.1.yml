name: Build And Upload Release 0.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-0.1
  cancel-in-progress: true

env:
  DOTNET_VERSION: 9.0.x
  PROJECT_PATH: VNEditor.csproj
  RELEASE_TAG: 0.1
  PUBLISH_DIR: artifacts/publish/win-x64
  RELEASE_DIR: artifacts/release
  RELEASE_ZIP: VNEditor-win-x64-release.zip

jobs:
  publish-and-upload:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:PROJECT_PATH

      - name: Publish Release Build
        shell: pwsh
        run: dotnet publish $env:PROJECT_PATH -c Release -r win-x64 --self-contained true -o $env:PUBLISH_DIR

      - name: Package Release Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:RELEASE_DIR | Out-Null
          $zipPath = Join-Path $env:RELEASE_DIR $env:RELEASE_ZIP
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath $zipPath

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VNEditor-win-x64-release
          path: ${{ env.RELEASE_DIR }}/${{ env.RELEASE_ZIP }}
          if-no-files-found: error

      - name: Ensure Release Exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY

      - name: Upload Asset To Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zipPath = Join-Path $env:RELEASE_DIR $env:RELEASE_ZIP
          gh release upload $env:RELEASE_TAG $zipPath --clobber --repo $env:GITHUB_REPOSITORY
