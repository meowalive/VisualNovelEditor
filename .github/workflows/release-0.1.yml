name: Build And Upload Release 0.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-0.1
  cancel-in-progress: true

env:
  DOTNET_VERSION: 9.0.x
  PROJECT_PATH: VNEditor.csproj
  RELEASE_TAG: Release
  PUBLISH_DIR: artifacts/publish/win-x64
  RELEASE_ASSET_NAME: VNEditor.exe

jobs:
  publish-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        shell: bash
        run: dotnet restore "$PROJECT_PATH"

      - name: Publish Release Build
        shell: bash
        run: |
          dotnet publish "$PROJECT_PATH" \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -o "$PUBLISH_DIR"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VNEditor-exe
          path: ${{ env.PUBLISH_DIR }}/${{ env.RELEASE_ASSET_NAME }}
          if-no-files-found: error

      - name: Ensure Release Exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

      - name: Upload Asset To Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assetPath="$PUBLISH_DIR/$RELEASE_ASSET_NAME"
          gh release upload "$RELEASE_TAG" "$assetPath" --clobber --repo "$GITHUB_REPOSITORY"
